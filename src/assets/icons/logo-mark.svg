<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 200" width="158" height="200" role="img" aria-label="DeepRead">
  <!-- DeepRead 品牌图形标识：镂空书本 + 鲸鱼（首页欢迎语 / 折叠侧边栏共用） -->
  <!-- 注意 1：鲸鱼裁剪区的 id 必须全局唯一（logo-mark-whale-clip）。
       同页共存的 logo-deepread.svg（Illustrator 导出）用 id="clippath"，
       若本文件也用同名 id，url(#clippath) 会解析到文档中第一个匹配，
       导致鲸鱼被错误的裁剪框裁没（消失）。 -->
  <!-- 注意 2：不要保留 Illustrator 导出的内嵌 <style>（.st0~.st3 为全局类名，
       会与 logo-deepread.svg 的同名类互相污染）；填充色一律写为元素属性 -->
  <defs>
    <clipPath id="logo-mark-whale-clip">
      <rect x="49.67" y="47.09" width="86.09" height="63.35"/>
    </clipPath>
  </defs>

